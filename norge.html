<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Statlete Norge — gjett utøveren</title>
<meta name="description" content="Gjett den norske friidrettsutøveren ut fra klubb, krets, fødselsår, UM-medaljer, Tyrvingpoeng og personlige rekorder.">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

  <header class="site-header">
    <h1>Statlete</h1>
    <p class="tagline">Gjett den norske friidrettsutøveren.</p>
    <nav class="modes" aria-label="Spillmodus">
      <a href="index.html">Verden</a>
      <a href="norge.html" aria-current="page">Norge</a>
    </nav>
  </header>

  <hr class="lane-line" aria-hidden="true">

  <main>
    <section aria-labelledby="guesses-heading">
      <h2 id="guesses-heading" class="sr-only">Gjettene dine</h2>

      <form id="guess-form" autocomplete="off">
        <label for="guess-input" class="sr-only">Utøvernavn</label>
        <input id="guess-input" list="athlete-list" placeholder="Skriv et utøvernavn" autocomplete="off">
        <button type="submit">Gjett</button>
      </form>
      <datalist id="athlete-list"></datalist>

      <p id="error" class="error" role="alert" hidden></p>
      <p id="status" class="status" role="status"></p>
      <button id="reset" class="reset" hidden>Spill igjen</button>

      <div id="guesses" class="guess-stack"></div>
    </section>
  </main>

  <footer class="site-footer">
    <p>Data fra minfriidrettsstatistikk.info. UM-medaljer og poeng (Tyrvingtabellen) er regnet ut av oss. Ikke tilknyttet Norges Friidrettsforbund.</p>
  </footer>

</div>
<script src="norge.js"></script>
</body>
</html>
