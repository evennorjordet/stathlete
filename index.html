<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stathlete — guess the athlete</title>
<meta name="description" content="A daily-style guessing game for track and field: work out the mystery athlete from country, age, medals, points score and revealed personal bests.">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

  <header class="site-header">
    <h1>Stathlete</h1>
    <p class="tagline">Guess the mystery track and field athlete.</p>
    <nav class="modes" aria-label="Game mode">
      <a href="index.html" aria-current="page">World</a>
      <a href="norge.html">Norway</a>
    </nav>
  </header>

  <hr class="lane-line" aria-hidden="true">

  <main>
    <section aria-labelledby="guesses-heading">
      <h2 id="guesses-heading" class="sr-only">Your guesses</h2>

      <form id="guess-form" autocomplete="off">
        <label for="guess-input" class="sr-only">Athlete name</label>
        <div class="combo">
          <input id="guess-input" role="combobox" aria-expanded="false" aria-controls="athlete-listbox" aria-autocomplete="list" placeholder="Type an athlete's name" autocomplete="off" spellcheck="false">
          <button type="button" id="combo-toggle" class="combo-toggle" aria-label="Show all athletes" tabindex="-1"></button>
          <ul id="athlete-listbox" class="combo-list" role="listbox" hidden></ul>
        </div>
        <button type="submit" id="guess-submit">Guess</button>
      </form>

      <p id="error" class="error" role="alert" hidden></p>
      <p id="status" class="status" role="status"></p>
      <button id="reset" class="reset" hidden>Play again</button>

      <div id="guesses" class="guess-stack"></div>
    </section>
  </main>


  <footer class="site-footer">
    <p>Data drawn from World Athletics athlete profiles. Not affiliated with or endorsed by World Athletics.</p>
  </footer>

</div>
<script src="combobox.js"></script>
<script src="script.js"></script>
</body>
</html>
